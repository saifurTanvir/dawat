name: Deploy

# Deploys to the VPS after CI passes: main -> production (dawat.cloud),
# develop -> staging (staging.dawat.cloud, set up once with deploy/setup-staging.sh).
# Can also be started by hand from the Actions tab ("Run workflow").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target:
        description: production or staging
        default: production

concurrency:
  group: deploy-${{ (github.event.workflow_run.head_branch == 'develop' || inputs.target == 'staging') && 'staging' || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to ${{ (github.event.workflow_run.head_branch == 'develop' || inputs.target == 'staging') && 'staging' || 'production' }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: production

    env:
      # Secrets live in Settings → Secrets and variables → Actions. See README.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      TARGET: ${{ (github.event.workflow_run.head_branch == 'develop' || inputs.target == 'staging') && 'staging' || 'production' }}
      DEPLOY_PATH: ${{ (github.event.workflow_run.head_branch == 'develop' || inputs.target == 'staging') && '/var/www/dawat-staging' || (secrets.DEPLOY_PATH || '/var/www/dawat') }}
      SITE_URL: ${{ (github.event.workflow_run.head_branch == 'develop' || inputs.target == 'staging') && (vars.STAGING_URL || 'https://staging.dawat.cloud') || vars.APP_URL }}

    steps:
      - name: Check that deploy secrets are set
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see README → Deployment)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, gd, zip, bcmath
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Package release
        id: package
        run: |
          release="$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short=7 HEAD)"
          tar --exclude=./.git --exclude=./node_modules --exclude=./tests \
              --exclude=./storage --exclude=./.env --exclude=./.github \
              -czf "/tmp/$release.tar.gz" .
          echo "release=$release" >> "$GITHUB_OUTPUT"
          du -h "/tmp/$release.tar.gz"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Accept the key as pasted (BEGIN … END) or as one base64 line
          # (base64 -w0 key), which survives copying from browser terminals.
          key="$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')"
          case "$key" in
            *"-----BEGIN"*) printf '%s\n' "$key" > ~/.ssh/deploy_key ;;
            *) printf '%s' "$key" | tr -d ' \n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || true ;;
          esac
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key. On the server run: base64 -w0 /root/dawat_deploy  and paste that one line as the secret."
            exit 1
          fi
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the server key seen now (set it to pin the key)."
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and activate release
        id: upload
        env:
          RELEASE: ${{ steps.package.outputs.release }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o BatchMode=yes"
          if [ "$TARGET" = "staging" ] && ! $SSH "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$DEPLOY_PATH/shared/.env'"; then
            echo "::notice::Staging is not set up on the server yet (run deploy/setup-staging.sh once). Skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/releases'"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o BatchMode=yes \
              "/tmp/$RELEASE.tar.gz" deploy/release.sh \
              "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" \
              "bash '$DEPLOY_PATH/releases/release.sh' '$DEPLOY_PATH' '$RELEASE' && rm -f '$DEPLOY_PATH/releases/release.sh'"

      - name: Check the site answers
        if: ${{ env.SITE_URL != '' && steps.upload.outputs.skipped != 'true' }}
        run: |
          # Staging sits behind a password, so 401 also means "nginx and PHP answer".
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/up")
            if [ "$code" = "200" ] || { [ "$TARGET" = "staging" ] && [ "$code" = "401" ]; }; then echo "Site is up ($code)"; exit 0; fi
            sleep 5
          done
          echo "::error::$SITE_URL/up did not answer after deploy (last code $code)"
          exit 1

      - name: Tell the owner on WhatsApp
        if: ${{ always() && steps.upload.outputs.skipped != 'true' }}
        env:
          WHATSAPP_NOTIFY_PHONE: ${{ secrets.WHATSAPP_NOTIFY_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TITLE: ${{ github.event.workflow_run.head_commit.message }}
          OUTCOME: ${{ job.status }}
        run: |
          title=$(printf '%s' "$TITLE" | grep -v '^Merge pull request' | grep -v '^$' | head -n1)
          [ -n "$title" ] || title=$(printf '%s' "$TITLE" | head -n1)
          if [ "$OUTCOME" = "success" ]; then
            if [ "$TARGET" = "staging" ]; then
              msg="দাওয়াত: স্টেজিংয়ে নতুন আপডেট ✅ ${title} — staging.dawat.cloud"
            else
              msg="দাওয়াত: নতুন আপডেট সাইটে লাইভ ✅ ${title} — dawat.cloud"
            fi
          else
            msg="দাওয়াত: ডেপ্লয় ব্যর্থ ❌ ${title}. সাইট আগের মতোই চলছে।"
          fi
          bash .github/scripts/whatsapp.sh "$msg"
